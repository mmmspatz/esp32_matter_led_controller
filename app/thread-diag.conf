# Thread diagnostic overlay (C6): OpenThread CLI + ping sender for on-air
# fragmentation testing. Not a production image. Use with:
#   west build -d build_diag -b btf_wled_esp32c6/esp32c6/hpcore app \
#       -- -DEXTRA_CONF_FILE=thread-diag.conf
#
# NB: OT INFO logging (OPENTHREAD_DEBUG / LOG_LEVEL_INFO) does NOT link under
# LOG_MODE_MINIMAL (undefined z_log_msg_runtime_vcreate) -- left off here.
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_PING_SENDER=y
CONFIG_OPENTHREAD_DIAG=y

# Surface the 15.4 driver's TX error path (the new -EBUSY/-ENOMSG/-EIO
# returns) so retransmission activity is visible during the sweep.
CONFIG_IEEE802154_DRIVER_LOG_LEVEL_ERR=y
