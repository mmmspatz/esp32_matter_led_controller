#
# btf_wled_esp32c6/esp32c6/hpcore (ESP32-C6-WROOM-1-N8 rework). The classic
# ESP32's DRAM bank-juggling doesn't apply: HP-SRAM is a single bank with no
# BT-controller carve-out, so the .noinit heap relocation, the BT-DRAM
# reclaim, the kernel-heap floor lowering and the WiFi-driver/PSA-slot trims
# all drop out (SOC_SERIES_ESP32 gate). The CHIP heap and kernel radio pool
# keep their upstream defaults; the portable net-stack lean values + minimal
# logging in prj.conf still apply.

# Matter BasicInformation hardware identity. The C6 rework is a distinct
# hardware revision of the same product (VID/PID unchanged); bumped from the
# classic board's 1.
CONFIG_CHIP_DEVICE_HARDWARE_VERSION=2
CONFIG_CHIP_DEVICE_HARDWARE_VERSION_STRING="btf-wled-esp32c6"

# Provisioning shell folded into the production image: 512K SRAM has room
# for it alongside BT, so one image commissions, provisions
# (scripts/provision.py over the console), and doubles as a field debug
# console. This is only our matter_prov command set; CHIP_LIB_SHELL stays off.
CONFIG_SHELL=y
CONFIG_LEDCTRL_PROV_SHELL=y
# matter_prov set carries a base64 SPAKE2+ verifier (~230 chars); the
# 256-byte default command buffer clips it. RX ring sized so a line pasted
# by scripts/provision.py isn't dropped before the shell drains it.
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512

# No CONFIG_FPU here: the rv32imac core has none, and with CPU_HAS_FPU=n
# the symbol is invisible (assignments would be ignored with a warning).
# app/Kconfig's guarded re-default keeps chip-module's blanket
# "FPU default y" from applying; float color math soft-floats.
