# WiFi diagnostic overlay (C6 WiFi build): instrumentation for the open
# "drops fully off WiFi after 1.7-6 h" bug. Not a production image. Use with:
#
#   west build --sysbuild -d build_wifidiag -p always \
#       -b btf_wled_esp32c6/esp32c6/hpcore app \
#       -- -DEXTRA_CONF_FILE="wifi.conf;wifi-diag.conf" \
#          -DEXTRA_DTC_OVERLAY_FILE=wifi.overlay \
#          -DCONFIG_LEDCTRL_WIFI_CREDS_SHELL=y
#
# Attack the fast symptom first. This board already re-establishes WiFi about
# every 100 s (see the kDnssdInitialized comment in
# scaffold/CommonDeviceCallbacks.cpp) -- that reproduces in two minutes, and
# it is what eventually feeds a run of failed scans into the recovery backoff.
# The multi-hour death is the downstream consequence, not the thing to sit and
# wait for.

# Full logging backend. prj.conf uses LOG_MODE_MINIMAL, which cannot render the
# runtime-formatted messages these modules emit -- the same constraint that
# keeps OpenThread INFO logs out of thread-diag.conf. IMMEDIATE rather than
# DEFERRED so nothing is stranded in a buffer when the link dies.
#
# Caveat: IMMEDIATE blocks the logging thread on a 115200 UART. If the extra
# latency perturbs the failure, drop CONFIG_WIFI_LOG_LEVEL_DBG to _INF first --
# the disconnect reason codes below are logged at INF.
CONFIG_LOG_MODE_IMMEDIATE=y

# esp32_wifi driver (LOG_MODULE_REGISTER(esp32_wifi, CONFIG_WIFI_LOG_LEVEL)) and
# the L2 management layer. The single most informative datum is the 802.11
# disconnect reason WiFiManager records via SetLastDisconnectReason(): reason 4
# (inactivity) vs 15 (4-way handshake / rekey timeout) vs 2 immediately splits
# AP-side eviction from device-side failure.
#
# NET_LOG is load-bearing, not decoration: every net subsys log level goes
# through Kconfig.template.log_config.net, whose choice is `depends on
# NET_LOG` and whose level falls back to `0 if !$(module-dep)`. Without it the
# NET_L2_WIFI_MGMT assignment below is silently ignored and the level stays
# OFF. (The esp32_wifi driver uses the plain template and does not need it.)
CONFIG_NET_LOG=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_NET_L2_WIFI_MGMT_LOG_LEVEL_DBG=y

# `wifi status` (state, RSSI, channel, BSSID), `wifi ps` and `wifi statistics`;
# `net iface` / `net stats` / `net conn` for the IP side. Poll these from the
# host over the console -- no firmware change needed to graph RSSI or to
# capture the state at the moment of death. `wifi ps off` also makes power
# save a runtime experiment: nothing in prj.conf pins it, so the build runs on
# the Espressif default (min-modem PS), a decent prior for periodic deauth.
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Runtime log filtering, and it is not optional in practice. CHIP registers its
# Zephyr log module as LOG_MODULE_REGISTER(chip, LOG_LEVEL_DBG) -- hardcoded, so
# MATTER_LOG_LEVEL cannot dial it down and every [DMG]/[EM] line is emitted. At
# 115200 that alone outruns the UART: measured, the log stream fell ~90 s behind
# real time within a two-minute capture, and under LOG_MODE_IMMEDIATE the device
# blocks on those writes, distorting the very timing being investigated.
#
# So after boot, silence CHIP and keep the radio at debug:
#
#   log enable wrn chip
#   log enable dbg esp32_wifi
#   log status
#
# Raise `chip` back to inf when you want WiFiManager's own progress lines (the
# recovery re-scan interval and the disconnect reason are ChipLogProgress).
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_CMDS=y

# Collapse the recovery backoff so the recovery path itself is testable in
# minutes. Stock MAXIMUM_INTERVAL is 3600000 ms and the interval doubles from
# MINIMUM_INTERVAL (500 ms) on each failed re-scan, so reaching the top of the
# ramp takes 13 doublings ~= 68 min of wall time. At 60000 ms it is 7 doublings
# ~= 2 min. Pair with patches/connectedhomeip/0007 (the jitter at the top of
# that ramp was uninitialised, which is what made the failure terminal).
#
# Diagnostic only -- do NOT copy into prj.conf without deciding what recovery
# cadence the product actually wants.
CONFIG_CHIP_WIFI_CONNECTION_RECOVERY_MAXIMUM_INTERVAL=60000
