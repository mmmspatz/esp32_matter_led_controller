#
# C6 WiFi build variant. The C6's default operational transport is
# Matter-over-Thread (see the LEDCTRL_TRANSPORT choice in app/Kconfig); this
# fragment forces WiFi instead. Pair it with the matching DT overlay:
#
#   west build --sysbuild -b btf_wled_esp32c6/esp32c6/hpcore app \
#       -- -DEXTRA_CONF_FILE=wifi.conf -DEXTRA_DTC_OVERLAY_FILE=wifi.overlay
#
# Composes with rgb.conf, e.g. C6 RGB over WiFi:
#   -DEXTRA_CONF_FILE="rgb.conf;wifi.conf" -DEXTRA_DTC_OVERLAY_FILE=wifi.overlay
#
# No-op on the classic ESP32, which is WiFi by default (and has no 802.15.4
# radio for Thread anyway).

CONFIG_LEDCTRL_TRANSPORT_WIFI=y
